#==============================================================================
# 11 — 일반 TCP 서비스 중계 (SMTP 예시)
#==============================================================================
# README: "설정 예제 모음 > 8. 일반 TCP 서비스 중계"
#
# HTTP가 아닌 서비스(메일, SSH, 사설 프로토콜 등)는 mode tcp로 그대로
# 흘려보내면 됩니다. 포트와 주소만 바꾸면 어떤 TCP 서비스에도 그대로 쓸 수
# 있습니다.
#
# [적용]
#   1. sudo cp /etc/haproxy/haproxy.cfg /etc/haproxy/haproxy.cfg.bak
#   2. 이 파일의 내용을 /etc/haproxy/haproxy.cfg 끝에 붙여 넣기
#   3. 포트와 10.0.0.x 주소를 실제 환경에 맞게 수정
#   4. sudo haproxy -c -f /etc/haproxy/haproxy.cfg && sudo systemctl reload haproxy
#
# [이 파일만 문법 검사]
#   /usr/share/haproxy/examples/check-example.sh 11-tcp-passthrough.cfg
#
# [로그 주의] mode tcp 에서는 option httplog 를 쓰면 안 됩니다. HTTP 정보가
#             없어 로그가 비어 보입니다. 예제처럼 option tcplog 로 바꿔 주세요.
#             defaults에 mode http가 있어도 각 섹션에서 mode tcp로 덮어쓰면 됩니다.
#==============================================================================

listen smtp
  bind :25
  mode tcp
  option tcplog
  balance roundrobin

  # option tcp-check 만 쓰면 포트가 열려 있는지만 확인합니다.
  option tcp-check

  # 더 정확히 보고 싶다면 실제로 주고받는 문자열을 지정하세요. 아래는 메일
  # 서버가 접속 시 보내는 220 인사말을 확인하는 예입니다. 주석을 푸세요.
  #tcp-check expect string 220

  server mail1 10.0.0.41:25 check
  server mail2 10.0.0.42:25 check
