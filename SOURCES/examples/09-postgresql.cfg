#==============================================================================
# 09 — PostgreSQL 부하 분산
#==============================================================================
# README: "설정 예제 모음 > 7. 데이터베이스 부하 분산 > PostgreSQL"
#
# 방식은 MySQL(07번)과 같고 점검 옵션만 pgsql-check 로 다릅니다.
#
# [먼저 DB에 점검 계정을 만드세요]
#
#   CREATE ROLE haproxy_check LOGIN;
#
# pg_hba.conf 에도 이 계정이 접속할 수 있도록 한 줄 추가해야 합니다. 예:
#
#   host  all  haproxy_check  10.0.0.0/24  trust
#
# 추가한 뒤 PostgreSQL을 리로드해야 반영됩니다 (systemctl reload postgresql).
#
# [적용]
#   1. sudo cp /etc/haproxy/haproxy.cfg /etc/haproxy/haproxy.cfg.bak
#   2. 이 파일의 내용을 /etc/haproxy/haproxy.cfg 끝에 붙여 넣기
#   3. 10.0.0.x 주소를 실제 환경에 맞게 수정
#   4. sudo haproxy -c -f /etc/haproxy/haproxy.cfg && sudo systemctl reload haproxy
#
# [이 파일만 문법 검사]
#   /usr/share/haproxy/examples/check-example.sh 09-postgresql.cfg
#==============================================================================

listen postgresql
  bind :5432
  mode tcp
  option tcplog
  balance leastconn
  timeout client 600s
  timeout server 600s
  option pgsql-check user haproxy_check
  server pg1 10.0.0.21:5432 check
  server pg2 10.0.0.22:5432 check backup
