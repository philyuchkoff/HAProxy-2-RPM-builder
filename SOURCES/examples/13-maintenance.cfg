#==============================================================================
# 13 — 서버 점검(maintenance) 처리
#==============================================================================
# README: "설정 예제 모음 > 10. 서버 점검(maintenance) 처리"
#
# 서버를 점검할 때 트래픽만 잠시 빼는 방법입니다. server 줄에 disabled를 붙이면
# 그 서버는 처음부터 제외된 채로 뜹니다.
#
# [적용]
#   1. sudo cp /etc/haproxy/haproxy.cfg /etc/haproxy/haproxy.cfg.bak
#   2. 이 파일의 내용을 /etc/haproxy/haproxy.cfg 끝에 붙여 넣기
#   3. 10.0.0.x 주소를 실제 환경에 맞게 수정
#   4. sudo haproxy -c -f /etc/haproxy/haproxy.cfg && sudo systemctl reload haproxy
#
# [이 파일만 문법 검사]
#   /usr/share/haproxy/examples/check-example.sh 13-maintenance.cfg
#
#------------------------------------------------------------------------------
# 실제 운영에서는 설정 파일을 고치는 것보다 관리 소켓 쪽이 훨씬 빠르고 안전합니다
#------------------------------------------------------------------------------
# HAProxy를 재시작하지 않으므로 다른 서버의 연결에 전혀 영향을 주지 않습니다.
# socat 이 없다면 먼저 설치하세요:  sudo dnf install -y socat
#
#   # 점검 시작 — 새 연결을 받지 않음 (기존 연결은 유지)
#   echo "disable server web_servers/web2" | sudo socat stdio /run/haproxy/haproxy.sock
#
#   # 점검 종료 — 다시 투입
#   echo "enable server web_servers/web2" | sudo socat stdio /run/haproxy/haproxy.sock
#
#   # 현재 상태 확인
#   echo "show servers state" | sudo socat stdio /run/haproxy/haproxy.sock
#
# 통계 페이지에서 stats admin 을 켜 두었다면 브라우저 버튼으로도 같은 일을
# 할 수 있습니다.
#
# [주의] 관리 소켓으로 바꾼 상태는 HAProxy를 재시작하면 사라지고 설정 파일
#        내용으로 돌아갑니다. 오래 빼 둘 서버라면 아래처럼 disabled 를 설정
#        파일에도 적어 두세요.
#==============================================================================

frontend web
  bind :80
  default_backend web_servers

backend web_servers
  balance roundrobin
  server web1 10.0.0.11:8080 check
  server web2 10.0.0.12:8080 check disabled
