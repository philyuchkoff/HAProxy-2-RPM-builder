#==============================================================================
# 03 — HTTPS 처리 (SSL 종료)
#==============================================================================
# README: "설정 예제 모음 > 3. HTTPS 처리 (SSL 종료)"
#
# HAProxy가 HTTPS를 대신 처리하고 뒤쪽 서버와는 평문 HTTP로 통신합니다.
# 인증서를 한 곳에서만 관리하면 되므로 가장 널리 쓰이는 방식입니다.
#
# [먼저 인증서를 준비하세요]
# HAProxy는 인증서와 개인키를 한 파일에 합쳐서 넣어야 합니다.
# 이 파일이 없으면 아래 설정은 문법 검사 단계에서 실패합니다.
#
#   sudo mkdir -p /etc/haproxy/certs
#   sudo cat /etc/letsencrypt/live/example.com/fullchain.pem \
#            /etc/letsencrypt/live/example.com/privkey.pem \
#            > /etc/haproxy/certs/example.com.pem
#   sudo chmod 600 /etc/haproxy/certs/example.com.pem
#
# 여러 도메인을 쓴다면 crt 뒤에 파일 대신 디렉터리를 지정하면 됩니다.
# HAProxy가 그 안의 인증서를 모두 읽어 SNI로 알아서 골라 씁니다.
#
#   bind :443 ssl crt /etc/haproxy/certs/
#
# [적용]
#   1. sudo cp /etc/haproxy/haproxy.cfg /etc/haproxy/haproxy.cfg.bak
#   2. 이 파일의 내용을 /etc/haproxy/haproxy.cfg 끝에 붙여 넣기
#   3. 인증서 경로와 10.0.0.x 주소를 실제 환경에 맞게 수정
#   4. sudo haproxy -c -f /etc/haproxy/haproxy.cfg && sudo systemctl reload haproxy
#
# [이 파일만 문법 검사] — 위 인증서 파일이 실제로 있어야 통과합니다.
#   /usr/share/haproxy/examples/check-example.sh 03-https-offload.cfg
#==============================================================================

frontend web
  bind :80
  bind :443 ssl crt /etc/haproxy/certs/example.com.pem

  # HTTP로 들어온 요청을 HTTPS로 되돌려 보냅니다. ssl_fc는 "이 연결이 SSL이냐"를
  # 뜻하므로, SSL이 아닐 때(unless)만 리다이렉트가 걸립니다.
  #
  # code 301을 빼면 302(임시 이동)로 응답합니다. HTTP를 영구히 닫을 생각이라면
  # 301을, 되돌릴 여지를 남겨 두고 싶다면 오히려 302가 안전합니다. 브라우저가
  # 301 결과를 캐시해 버리기 때문입니다.
  http-request redirect scheme https code 301 unless { ssl_fc }

  http-response set-header Strict-Transport-Security "max-age=31536000"
  default_backend web_servers

backend web_servers
  balance roundrobin
  option forwardfor

  # 뒤쪽 애플리케이션에게 "원래는 HTTPS 요청이었다"고 알려 줍니다. 이게 없으면
  # 애플리케이션이 만드는 링크가 http:// 로 나가서 무한 리다이렉트가 생기는
  # 일이 흔합니다.
  http-request set-header X-Forwarded-Proto https if { ssl_fc }

  server web1 10.0.0.11:8080 check
  server web2 10.0.0.12:8080 check
