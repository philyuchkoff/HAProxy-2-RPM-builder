#==============================================================================
# 02 — 백엔드에 진짜 접속자 IP 알려주기
#==============================================================================
# README: "설정 예제 모음 > 2. 백엔드에 진짜 접속자 IP 알려주기"
#
# 부하 분산을 걸면 웹 서버 입장에서는 모든 요청이 HAProxy에서 온 것처럼
# 보입니다. option forwardfor 한 줄을 넣으면 X-Forwarded-For 헤더에 원래
# 접속자 IP가 담겨 전달됩니다.
#
# 이 예제의 핵심은 backend 안의 "option forwardfor" 한 줄뿐입니다. 나머지는
# 01번 예제와 같으며, 파일 하나로 문법 검사가 되도록 frontend를 함께 넣었습니다.
# 이미 01번 예제를 붙여 넣었다면 backend에 option forwardfor 줄만 추가하세요.
#
# [적용]
#   1. sudo cp /etc/haproxy/haproxy.cfg /etc/haproxy/haproxy.cfg.bak
#   2. 이 파일의 내용을 /etc/haproxy/haproxy.cfg 끝에 붙여 넣기
#   3. 10.0.0.x 주소와 포트를 실제 환경에 맞게 수정
#   4. sudo haproxy -c -f /etc/haproxy/haproxy.cfg && sudo systemctl reload haproxy
#
# [이 파일만 문법 검사]
#   /usr/share/haproxy/examples/check-example.sh 02-real-client-ip.cfg
#
# [주의] HAProxy에 넣는 것만으로는 끝이 아닙니다. 애플리케이션(또는 그 앞의
#        Nginx/Tomcat)에서 X-Forwarded-For 헤더를 신뢰하도록 설정해 주어야
#        로그에 실제 접속자 IP가 제대로 찍힙니다.
#==============================================================================

frontend web
  bind :80
  default_backend web_servers

backend web_servers
  balance roundrobin
  option forwardfor
  server web1 10.0.0.11:8080 check
  server web2 10.0.0.12:8080 check
