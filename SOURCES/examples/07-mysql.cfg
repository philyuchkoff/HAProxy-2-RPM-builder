#==============================================================================
# 07 — MySQL / MariaDB 부하 분산
#==============================================================================
# README: "설정 예제 모음 > 7. 데이터베이스 부하 분산 > MySQL / MariaDB"
#
# 데이터베이스는 HTTP가 아니므로 반드시 mode tcp 로 동작시켜야 합니다.
# 그리고 웹과 달리 연결이 오래 유지되므로 타임아웃을 넉넉히 잡아야 합니다.
# defaults의 기본값인 50초를 그대로 쓰면 조금 긴 쿼리가 도중에 끊깁니다.
#
# [먼저 DB에 점검 계정을 만드세요]
# option mysql-check 는 전용 점검 계정으로 접속만 시도합니다. 비밀번호도
# 권한도 필요 없습니다. 계정이 없으면 모든 서버가 DOWN으로 표시됩니다.
#
#   CREATE USER 'haproxy_check'@'10.0.0.%';
#
# [적용]
#   1. sudo cp /etc/haproxy/haproxy.cfg /etc/haproxy/haproxy.cfg.bak
#   2. 이 파일의 내용을 /etc/haproxy/haproxy.cfg 끝에 붙여 넣기
#   3. 10.0.0.x 주소를 실제 환경에 맞게 수정
#   4. sudo haproxy -c -f /etc/haproxy/haproxy.cfg && sudo systemctl reload haproxy
#
# [이 파일만 문법 검사]
#   /usr/share/haproxy/examples/check-example.sh 07-mysql.cfg
#
# [쓰기/읽기를 나눠야 한다면] 이 구성만으로는 부족합니다.
# 08-mysql-rw-split.cfg 를 보세요.
#==============================================================================

listen mysql
  bind :3306

  # DB는 HTTP가 아니므로 mode tcp. 로그도 tcplog로 바꿔야 합니다.
  # (defaults에 mode http가 있어도 여기서 덮어쓰면 됩니다.)
  mode tcp
  option tcplog

  # 연결이 오래 유지되므로 연결 수가 가장 적은 서버로 보냅니다.
  balance leastconn

  # 긴 쿼리가 중간에 끊기지 않도록 넉넉히 잡습니다.
  timeout client 600s
  timeout server 600s

  option mysql-check user haproxy_check

  # backup : 평소에는 쓰지 말고 앞의 서버가 모두 죽었을 때만 쓰라는 뜻입니다.
  server db1 10.0.0.21:3306 check
  server db2 10.0.0.22:3306 check backup
