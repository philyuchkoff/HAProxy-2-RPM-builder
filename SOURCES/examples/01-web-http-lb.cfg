#==============================================================================
# 01 — 웹 서버 부하 분산 (HTTP)
#==============================================================================
# README: "설정 예제 모음 > 1. 웹 서버 부하 분산 (HTTP)"
#
# 여러 대의 웹 서버(WAS)에 요청을 번갈아 나눠 주고, 헬스체크에 실패한 서버는
# 자동으로 빼 주는 가장 기본이 되는 형태입니다.
#
# [적용]
#   1. sudo cp /etc/haproxy/haproxy.cfg /etc/haproxy/haproxy.cfg.bak
#   2. 이 파일의 내용(주석 아래 전체)을 /etc/haproxy/haproxy.cfg 끝에 붙여 넣기
#   3. 10.0.0.x 주소와 포트를 실제 환경에 맞게 수정
#   4. sudo haproxy -c -f /etc/haproxy/haproxy.cfg && sudo systemctl reload haproxy
#
# [이 파일만 문법 검사]
#   /usr/share/haproxy/examples/check-example.sh 01-web-http-lb.cfg
#
# [바꿔 볼 만한 값]
#   balance roundrobin   차례대로 배분. 서버 성능이 비슷하면 이게 무난합니다.
#                        leastconn(연결 수가 적은 쪽), source(접속자 IP 고정),
#                        first(첫 번째 서버에 몰아주기), uri(URL 해시)로 바꿀 수 있습니다.
#   GET /health          헬스체크 경로. / 같은 무거운 페이지 대신 DB 연결 정도만
#                        확인하고 바로 200을 돌려주는 가벼운 전용 경로를 쓰세요.
#                        기본 2초마다 호출되므로 무거우면 그 자체가 부하가 됩니다.
#==============================================================================

frontend web
  bind :80
  default_backend web_servers

backend web_servers
  balance roundrobin
  option httpchk GET /health
  http-check expect status 200
  server web1 10.0.0.11:8080 check
  server web2 10.0.0.12:8080 check

# 체크 간격을 조정하려면 check 뒤에 옵션을 붙입니다. 순간적인 네트워크 불안정
# 때문에 서버가 들락날락하는 것을 막아 줍니다.
#
#   inter 5s   5초마다 검사
#   fall 3     3회 연속 실패해야 죽은 것으로 판정
#   rise 2     2회 연속 성공해야 다시 살리는 것으로 판정
#
#   server web1 10.0.0.11:8080 check inter 5s fall 3 rise 2
