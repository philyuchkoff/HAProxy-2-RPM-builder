#==============================================================================
# 10 — Redis 마스터 자동 선택
#==============================================================================
# README: "설정 예제 모음 > 7. 데이터베이스 부하 분산 > Redis"
#
# Redis는 마스터 한 대에만 써야 하므로, 마스터를 자동으로 찾아내는 헬스체크를
# 씁니다. tcp-check가 실제로 Redis에 접속해 PING을 보내고 +PONG을 확인한 뒤,
# INFO replication 결과에 role:master 가 있는지까지 봅니다. 복제(slave) 서버는
# 이 검사를 통과하지 못하므로 자동으로 제외됩니다.
#
# 장애 조치(failover)로 마스터가 바뀌면 HAProxy가 알아서 새 마스터로 트래픽을
# 옮깁니다.
#
# [적용]
#   1. sudo cp /etc/haproxy/haproxy.cfg /etc/haproxy/haproxy.cfg.bak
#   2. 이 파일의 내용을 /etc/haproxy/haproxy.cfg 끝에 붙여 넣기
#   3. 10.0.0.x 주소를 실제 환경에 맞게 수정
#   4. sudo haproxy -c -f /etc/haproxy/haproxy.cfg && sudo systemctl reload haproxy
#
# [이 파일만 문법 검사]
#   /usr/share/haproxy/examples/check-example.sh 10-redis.cfg
#
# [문법 주의] send 줄의 \r\n 과 info\ replication 의 백슬래시는 문법상 반드시
#             필요합니다. 지우거나 공백으로 바꾸지 마세요.
#             (\  는 "여기 공백이 있다"는 표시이고, \r\n 은 Redis 프로토콜의
#              줄바꿈입니다.)
#
# [비밀번호가 걸린 Redis라면] PING 앞에 인증을 먼저 보내야 합니다.
#             tcp-check send AUTH\ 비밀번호\r\n
#             tcp-check expect string +OK
#==============================================================================

listen redis
  bind :6379
  mode tcp
  option tcplog

  # 살아 있는(=마스터인) 첫 번째 서버에 몰아줍니다.
  balance first

  option tcp-check
  tcp-check send PING\r\n
  tcp-check expect string +PONG
  tcp-check send info\ replication\r\n
  tcp-check expect string role:master
  tcp-check send QUIT\r\n
  tcp-check expect string +OK

  # inter 1s — 마스터가 바뀌었을 때 빨리 따라가도록 1초 간격으로 검사합니다.
  server redis1 10.0.0.31:6379 check inter 1s
  server redis2 10.0.0.32:6379 check inter 1s
