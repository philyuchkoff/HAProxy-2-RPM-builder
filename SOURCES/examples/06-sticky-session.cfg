#==============================================================================
# 06 — 세션 고정 (sticky session)
#==============================================================================
# README: "설정 예제 모음 > 6. 세션 고정 (sticky session)"
#
# 로그인 상태를 서버 메모리에 들고 있는 애플리케이션이라면 같은 사용자를 계속
# 같은 서버로 보내야 합니다. HAProxy가 쿠키를 심어서 처리해 줍니다.
#
# [적용]
#   1. sudo cp /etc/haproxy/haproxy.cfg /etc/haproxy/haproxy.cfg.bak
#   2. 이 파일의 내용을 /etc/haproxy/haproxy.cfg 끝에 붙여 넣기
#   3. 10.0.0.x 주소와 포트를 실제 환경에 맞게 수정
#   4. sudo haproxy -c -f /etc/haproxy/haproxy.cfg && sudo systemctl reload haproxy
#
# [이 파일만 문법 검사]
#   /usr/share/haproxy/examples/check-example.sh 06-sticky-session.cfg
#
# [먼저 생각해 볼 것]
# 세션 고정은 편리하지만 부하가 고르게 나뉘지 않는 부작용이 있습니다. 한 서버가
# 죽으면 그 서버에 묶여 있던 사용자는 로그인이 풀립니다. 가능하다면 세션을
# Redis 같은 외부 저장소로 빼서 세션 고정 자체가 필요 없게 만드는 편이
# 근본적인 해법입니다.
#==============================================================================

frontend web
  bind :80
  default_backend web_servers

backend web_servers
  balance roundrobin

  # cookie SRVID insert : HAProxy가 SRVID라는 쿠키를 직접 만들어 응답에 넣습니다.
  #                       브라우저가 이 쿠키를 다시 보내면 원래 서버로 되돌려 줍니다.
  # indirect nocache    : 이 쿠키가 애플리케이션에 전달되지 않게 하고, 중간
  #                       캐시에 저장되지 않게 막는 안전장치입니다.
  cookie SRVID insert indirect nocache

  # 각 server 줄 끝의 cookie 값이 그 쿠키에 담깁니다.
  server web1 10.0.0.11:8080 check cookie web1
  server web2 10.0.0.12:8080 check cookie web2

#------------------------------------------------------------------------------
# 대안 — 쿠키를 쓸 수 없는 환경(예: mode tcp)
#------------------------------------------------------------------------------
# balance source 는 접속자 IP를 해시해 항상 같은 서버로 보냅니다. 위의
# backend web_servers 대신 아래를 쓰세요.
#
#   backend web_servers
#     balance source
#     server web1 10.0.0.11:8080 check
#     server web2 10.0.0.12:8080 check
#
# 다만 여러 사용자가 같은 공인 IP(회사 NAT 등)로 나오면 한 서버에 몰립니다.
#------------------------------------------------------------------------------
