#==============================================================================
# 12 — 접속 제한과 속도 제한
#==============================================================================
# README: "설정 예제 모음 > 9. 접속 제한과 속도 제한"
#
# 특정 IP에서 짧은 시간에 과도한 요청이 오면 차단합니다. 단순한 크롤러나
# 무차별 로그인 시도를 막는 데 효과적입니다.
#
# [적용]
#   1. sudo cp /etc/haproxy/haproxy.cfg /etc/haproxy/haproxy.cfg.bak
#   2. 이 파일의 내용을 /etc/haproxy/haproxy.cfg 끝에 붙여 넣기
#   3. 임계값(100), 내부망 대역, 10.0.0.x 주소를 실제 환경에 맞게 수정
#   4. sudo haproxy -c -f /etc/haproxy/haproxy.cfg && sudo systemctl reload haproxy
#
# [이 파일만 문법 검사]
#   /usr/share/haproxy/examples/check-example.sh 12-rate-limit.cfg
#
# [임계값 정하는 법] 서비스 성격에 따라 크게 다릅니다. 처음에는 넉넉하게 잡고
#             통계 페이지(기본 http://서버IP:9000/haproxy_stats)의 Denied 열을
#             보면서 조여 나가세요. 너무 빡빡하면 정상 사용자가 차단됩니다.
#
# [주의] 앞단에 CDN이나 또 다른 프록시가 있으면 모든 요청의 src가 그 프록시
#        IP 하나로 보여 전체가 한꺼번에 차단될 수 있습니다. 그런 환경에서는
#        src 대신 X-Forwarded-For 헤더를 추적하세요.
#          http-request track-sc0 hdr_ip(X-Forwarded-For,-1)
#==============================================================================

frontend web
  bind :80

  # IP별 요청 횟수를 기억하는 표입니다.
  #   size 100k              최대 10만 개 IP를 기억
  #   expire 30s             30초간 요청이 없으면 기록 삭제
  #   store http_req_rate(10s)  최근 10초간의 요청 수를 집계
  stick-table type ip size 100k expire 30s store http_req_rate(10s)

  # 접속자 IP를 위 표에 기록합니다.
  http-request track-sc0 src

  # 최근 10초간 요청이 100건을 넘으면 429 Too Many Requests로 거절합니다.
  http-request deny deny_status 429 if { sc_http_req_rate(0) gt 100 }

  # /admin 경로는 내부망에서만 열어 줍니다. 관리자 페이지를 외부에 노출하지
  # 않는 간단하고 확실한 방법입니다.
  acl allowed_net src 10.0.0.0/8 192.168.0.0/16
  http-request deny if { path_beg /admin } !allowed_net

  default_backend web_servers

backend web_servers
  # maxconn 200 — 그 서버가 동시에 처리할 연결 수를 제한합니다. 백엔드가
  # 감당할 수 있는 수준을 넘어서면 HAProxy가 대기시켜 주므로, 트래픽 폭주로
  # 서버가 통째로 넘어가는 것을 막아 줍니다.
  server web1 10.0.0.11:8080 check maxconn 200
