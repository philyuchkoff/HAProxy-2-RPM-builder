#==============================================================================
# 05 — 경로·도메인별로 다른 서버에 보내기
#==============================================================================
# README: "설정 예제 모음 > 5. 경로·도메인별로 다른 서버에 보내기"
#
# 한 대의 HAProxy로 여러 서비스를 나눠 받는 방법입니다. acl로 조건에 이름을
# 붙이고 use_backend로 연결합니다.
#
# [적용]
#   1. sudo cp /etc/haproxy/haproxy.cfg /etc/haproxy/haproxy.cfg.bak
#   2. 이 파일의 내용을 /etc/haproxy/haproxy.cfg 끝에 붙여 넣기
#   3. 도메인과 10.0.0.x 주소를 실제 환경에 맞게 수정
#   4. sudo haproxy -c -f /etc/haproxy/haproxy.cfg && sudo systemctl reload haproxy
#
# [이 파일만 문법 검사]
#   /usr/share/haproxy/examples/check-example.sh 05-routing-acl.cfg
#
# [규칙 순서가 중요합니다]
# use_backend는 위에서부터 순서대로 평가되고 먼저 맞는 것이 이깁니다.
# 범위가 좁은 조건을 위에, 넓은 조건을 아래에 두세요. 어느 조건에도 걸리지
# 않으면 default_backend로 갑니다.
#
# [자주 쓰는 조건]
#   path_beg /api                경로가 /api로 시작
#   path_end .jpg .png           경로가 해당 확장자로 끝남
#   hdr(host) -i example.com     Host 헤더가 일치 (-i 는 대소문자 무시)
#   hdr_beg(host) -i api.        Host가 api. 로 시작 (서브도메인)
#   src 10.0.0.0/8               접속자 IP가 해당 대역
#   method POST                  HTTP 메서드가 POST
#==============================================================================

frontend web
  bind :80

  acl is_api      path_beg /api
  acl is_static   path_beg /static /images
  acl is_admin    hdr(host) -i admin.example.com

  use_backend api_servers    if is_api
  use_backend static_servers if is_static
  use_backend admin_servers  if is_admin
  default_backend web_servers

backend api_servers
  balance leastconn
  server api1 10.0.0.21:8080 check

backend static_servers
  balance roundrobin
  server st1 10.0.0.31:80 check

backend admin_servers
  server adm1 10.0.0.41:8080 check

backend web_servers
  server web1 10.0.0.11:8080 check
