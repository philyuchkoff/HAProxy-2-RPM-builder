#==============================================================================
# 00-base.cfg — 예제 문법 검사용 최소 뼈대
#==============================================================================
# 이 파일은 "붙여 넣는 예제"가 아닙니다.
#
# 나머지 예제 파일(01~13)에는 frontend/backend/listen 블록만 들어 있습니다.
# 그래야 파일 내용을 통째로 /etc/haproxy/haproxy.cfg 끝에 붙여 넣을 수 있기
# 때문입니다. 대신 예제 파일 하나만으로는 global/defaults가 없어 문법 검사를
# 할 수 없으므로, 그 자리를 채워 주는 것이 이 파일입니다.
#
# 사용법 — HAProxy는 -f 를 여러 번 쓰면 파일을 순서대로 이어 붙여 읽습니다.
#
#   haproxy -c -f /usr/share/haproxy/examples/00-base.cfg \
#              -f /usr/share/haproxy/examples/01-web-http-lb.cfg
#
# 같은 일을 해 주는 도우미 스크립트도 함께 설치됩니다.
#
#   /usr/share/haproxy/examples/check-example.sh 01-web-http-lb.cfg
#
# 내용은 패키지 기본 설정(/etc/haproxy/haproxy.cfg)의 global/defaults와
# 같습니다. 실제 서비스에 쓰는 설정이 아니라 검사용 뼈대이므로 listen stats는
# 빠져 있습니다.
#==============================================================================

global
    log 127.0.0.1 local0
    log 127.0.0.1 local1 notice
    chroot /var/lib/haproxy
    stats socket /run/haproxy/haproxy.sock mode 600 level admin
    stats timeout 30s
    user haproxy
    group haproxy

    ca-base /etc/ssl/certs
    crt-base /etc/ssl/private
    ssl-default-bind-ciphers kEECDH+aRSA+AES:kRSA+AES:+AES256:RC4-SHA:!kEDH:!LOW:!EXP:!MD5:!aNULL:!eNULL

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    timeout connect 5000
    timeout client  50000
    timeout server  50000
    errorfile 400 /etc/haproxy/errors/400.http
    errorfile 403 /etc/haproxy/errors/403.http
    errorfile 408 /etc/haproxy/errors/408.http
    errorfile 500 /etc/haproxy/errors/500.http
    errorfile 502 /etc/haproxy/errors/502.http
    errorfile 503 /etc/haproxy/errors/503.http
    errorfile 504 /etc/haproxy/errors/504.http
