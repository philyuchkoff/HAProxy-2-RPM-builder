#==============================================================================
# 04 — HTTP/2 사용하기
#==============================================================================
# README: "설정 예제 모음 > 4. HTTP/2 사용하기"
#
# alpn h2,http/1.1 을 붙이면 HTTP/2를 지원하는 브라우저와는 HTTP/2로,
# 아니면 HTTP/1.1로 통신합니다.
#
# [먼저 인증서를 준비하세요] — 03번 예제와 같습니다.
#   sudo mkdir -p /etc/haproxy/certs
#   sudo cat .../fullchain.pem .../privkey.pem > /etc/haproxy/certs/example.com.pem
#   sudo chmod 600 /etc/haproxy/certs/example.com.pem
#
# [적용]
#   1. sudo cp /etc/haproxy/haproxy.cfg /etc/haproxy/haproxy.cfg.bak
#   2. 이 파일의 내용을 /etc/haproxy/haproxy.cfg 끝에 붙여 넣기
#   3. 인증서 경로와 10.0.0.x 주소를 실제 환경에 맞게 수정
#   4. sudo haproxy -c -f /etc/haproxy/haproxy.cfg && sudo systemctl reload haproxy
#
# [이 파일만 문법 검사] — 위 인증서 파일이 실제로 있어야 통과합니다.
#   /usr/share/haproxy/examples/check-example.sh 04-http2.cfg
#==============================================================================

frontend web
  bind :443 ssl crt /etc/haproxy/certs/example.com.pem alpn h2,http/1.1
  default_backend web_servers

backend web_servers
  balance roundrobin

  # web1 — HAProxy와 뒤쪽 서버 사이는 평문 HTTP
  server web1 10.0.0.11:8080 check

  # web2 — HAProxy와 뒤쪽 서버 사이도 HTTPS/HTTP2로 연결합니다.
  #   verify none : 내부망이라 인증서 검증이 필요 없을 때만 쓰세요.
  #                 인터넷을 거친다면 verify required 와 ca-file 을 제대로 지정해야 합니다.
  server web2 10.0.0.12:8443 check ssl verify none alpn h2
