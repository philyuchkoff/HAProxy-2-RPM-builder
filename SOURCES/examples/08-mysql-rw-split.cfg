#==============================================================================
# 08 — MySQL / MariaDB 쓰기·읽기 분리
#==============================================================================
# README: "설정 예제 모음 > 7. 데이터베이스 부하 분산 > MySQL / MariaDB"
#
# 07번 예제처럼 한 포트로 묶으면 쓰기(master)와 읽기(replica)를 구분할 수
# 없습니다. HAProxy는 SQL 문을 해석하지 않기 때문입니다. 포트를 따로 열고
# 애플리케이션에서 쓰기는 3306, 읽기는 3307로 접속하도록 나누세요.
#
# [먼저 DB에 점검 계정을 만드세요]
#   CREATE USER 'haproxy_check'@'10.0.0.%';
#
# [적용]
#   1. sudo cp /etc/haproxy/haproxy.cfg /etc/haproxy/haproxy.cfg.bak
#   2. 이 파일의 내용을 /etc/haproxy/haproxy.cfg 끝에 붙여 넣기
#   3. 10.0.0.x 주소를 실제 환경에 맞게 수정
#   4. sudo haproxy -c -f /etc/haproxy/haproxy.cfg && sudo systemctl reload haproxy
#
# [이 파일만 문법 검사]
#   /usr/share/haproxy/examples/check-example.sh 08-mysql-rw-split.cfg
#
# [주의] 이 설정은 마스터 승격(failover)을 대신해 주지 않습니다. standby가
#        읽기 전용인 채로 승격되면 쓰기 요청이 실패합니다. 승격은 MHA,
#        Orchestrator, Galera 같은 별도 도구가 맡아야 합니다.
#==============================================================================

# 쓰기 전용 — 마스터 한 대에만 보냅니다. balance를 쓰지 않으므로 앞에서부터
# 살아 있는 첫 서버가 선택됩니다.
listen mysql_write
  bind :3306
  mode tcp
  option tcplog
  timeout client 600s
  timeout server 600s
  option mysql-check user haproxy_check
  server master  10.0.0.21:3306 check
  server standby 10.0.0.22:3306 check backup

# 읽기 전용 — 복제 서버들에 고르게 나눠 줍니다.
listen mysql_read
  bind :3307
  mode tcp
  option tcplog
  balance roundrobin
  timeout client 600s
  timeout server 600s
  option mysql-check user haproxy_check
  server replica1 10.0.0.22:3306 check
  server replica2 10.0.0.23:3306 check
